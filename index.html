<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mathe-Arbeitsblattgenerator</title><style>body{font-family:Arial,sans-serif;margin:0;background:#eef2f7;color:#172235}.controls{max-width:920px;margin:20px auto;padding:20px;background:white;border-radius:12px}fieldset{border:1px solid #cbd5e1;border-radius:8px;margin:12px 0;padding:12px}label{display:inline-block;margin:7px 14px 7px 0}button{padding:12px 17px;margin:6px;border:0;border-radius:8px;background:#2059a5;color:white;font-weight:bold;cursor:pointer}.hint{color:#526173}.pages{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin:20px}.sheet{width:210mm;height:297mm;box-sizing:border-box;background:white;box-shadow:0 3px 15px #aab;display:flex;flex-direction:column}.half{height:50%;box-sizing:border-box;padding:12mm 14mm;position:relative}.half:first-child{border-bottom:1px dashed #777}.top{display:flex;justify-content:space-between;align-items:center;font-size:12px}.top strong{font-size:17px}.identity{display:flex;justify-content:space-between;margin-top:16px;font-size:14px}.tasks{display:grid;grid-template-columns:1fr 1fr;column-gap:9mm;row-gap:0;margin-top:8mm;height:calc(100% - 30mm);font-size:21px;min-height:0;grid-auto-flow:row}.task{display:flex;align-items:center;gap:9px;min-width:0;white-space:nowrap;overflow:hidden}.task .small{flex:0 0 21px}.equation{display:flex!important;flex-direction:row!important;align-items:center;gap:5px;font-family:Courier New,monospace;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.15;width:max-content}.equation>span{display:inline-block!important;flex:none!important}.equation>.operand{width:calc(var(--digits) * 1ch);text-align:right}.equation>.symbol{width:1.4ch;text-align:center}.operand{text-align:right;white-space:nowrap;min-width:0}.symbol{text-align:center}.solution-box{display:block;width:100%;height:1.35em;border:1.7px solid #333;box-sizing:border-box}.solution-value{font-weight:700}.cut{position:absolute;bottom:-9px;left:4px;background:white;color:#666;font-size:12px}.small{font-size:16px}.hidden{display:none!important}@page{size:A4 portrait;margin:0}@media print{body{background:white}.controls,.hint,.page-label{display:none!important}.pages{display:block;margin:0}.sheet{box-shadow:none;break-after:page;margin:0}.sheet:last-child{break-after:auto}}@media(max-width:760px){.sheet{transform-origin:top center;zoom:.65}.controls{margin:8px}.pages{gap:0}}</style></head><body><section class="controls"><h1>Mathe-Arbeitsblattgenerator</h1><p class="hint">Zwei unterschiedliche Arbeitsblätter auf A4, mit zugehörigem Lösungsblatt.</p><fieldset><legend>Bereich</legend><label><input type="radio" name="mode" value="add" checked> Addition / Subtraktion</label><label><input type="radio" name="mode" value="mul"> Multiplikation / Division</label></fieldset><fieldset id="ranges"><legend>Zahlenraum</legend><label><input type="radio" name="range" value="10"> bis 10</label><label><input type="radio" name="range" value="20" checked> bis 20</label><label><input type="radio" name="range" value="100"> bis 100</label><label><input type="radio" name="range" value="1000"> bis 1000</label></fieldset><fieldset id="series" class="hidden"><legend>Einmaleinsreihen</legend><div id="series-options"></div><button type="button" id="all">Alle</button><button type="button" id="none">Keine</button></fieldset><fieldset><legend>Rechenarten (Mehrfachauswahl)</legend><div id="operations"></div></fieldset><fieldset><legend>Gesuchte Zahl (Mehrfachauswahl)</legend><label><input type="checkbox" name="missing" value="0"> erste Zahl</label><label><input type="checkbox" name="missing" value="1"> zweite Zahl</label><label><input type="checkbox" name="missing" value="2" checked> Ergebnis</label></fieldset><fieldset><legend>Aufgaben pro halber Seite</legend><label><select id="count"><option>8</option><option>10</option><option selected>12</option><option>14</option><option>16</option></select></label></fieldset><button id="generate">Neue Aufgaben erzeugen</button><button id="print">Arbeitsblätter und Lösungen drucken / als PDF sichern</button><p id="message" role="status"></p></section><div class="pages"><div><p class="page-label">Aufgabenblatt</p><div id="worksheets" class="sheet"></div></div><div><p class="page-label">Lösungsblatt</p><div id="solutions" class="sheet"></div></div></div><script>
let number=0;const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];const randint=(lo,hi)=>lo+Math.floor(Math.random()*(hi-lo+1));const choice=a=>a[randint(0,a.length-1)];const mode=()=> $('input[name=mode]:checked').value;
for(let i=1;i<=12;i++){const l=document.createElement('label');l.innerHTML=`<input type="checkbox" name="series" value="${i}" ${i<=10?'checked':''}> ${i}`;$('#series-options').append(l)}
function update(){const mul=mode()==='mul';$('#ranges').classList.toggle('hidden',mul);$('#series').classList.toggle('hidden',!mul);$('#operations').innerHTML=mul?'<label><input type="checkbox" name="op" value="×" checked> Mal (·)</label><label><input type="checkbox" name="op" value="÷"> Geteilt (:)</label>':'<label><input type="checkbox" name="op" value="+" checked> Plus (+)</label><label><input type="checkbox" name="op" value="−"> Minus (−)</label>'}
$$('input[name=mode]').forEach(x=>x.addEventListener('change',()=>{update();generate()}));$('#all').onclick=()=>$$('input[name=series]').forEach(x=>x.checked=true);$('#none').onclick=()=>$$('input[name=series]').forEach(x=>x.checked=false);
function task(op,missing,limit,series){let a,b,c;if(op==='+'||op==='−'){a=randint(1,limit-1);b=randint(1,limit-a);c=a+b;if(op==='−'){[a,b,c]=[c,b,a]}}else{const factor=choice(series);const other=randint(1,10);if(op==='×'){a=factor;b=other;c=a*b}else{a=factor*other;b=factor;c=other}}const vals=[a,b,c],sign={'×':'·','÷':':'}[op]||op;const display=vals.map((v,i)=>i===missing?'<BOX>':String(v));return {vals,sign,missing,question:`${display[0]} ${sign} ${display[1]} = ${display[2]}`,answer:`${vals[0]} ${sign} ${vals[1]} = ${vals[2]}`}}
function half(num,tasks,solution){const h=document.createElement('div');h.className='half';const head=document.createElement('div');head.className='top';head.innerHTML=`<span>Nr. ${String(num).padStart(3,'0')}</span><strong>${mode()==='add'?'Addition und Subtraktion':'Multiplikation und Division'}${solution?' – Lösungen':''}</strong>`;h.append(head);const id=document.createElement('div');id.className='identity';id.innerHTML='<span>Name: ____________________</span><span>Datum: __________</span>';h.append(id);const grid=document.createElement('div');grid.className='tasks';grid.style.gridTemplateRows=`repeat(${Math.ceil(tasks.length/2)},minmax(0,1fr))`;tasks.forEach((t,i)=>{const el=document.createElement('div');el.className='task';el.style.gridColumn=i<Math.ceil(tasks.length/2)?'1':'2';el.style.gridRow=String(i%Math.ceil(tasks.length/2)+1);const prefix=document.createElement('span');prefix.className='small';prefix.textContent=String.fromCharCode(97+i)+'.  ';el.append(prefix);const val=document.createElement('span');val.className='equation';val.style.setProperty('--digits',String(window.currentDigits||3));const parts=[t.vals[0],t.sign,t.vals[1],'=',t.vals[2]];parts.forEach((part,idx)=>{const cell=document.createElement('span');cell.className=(idx%2===0?'operand':'symbol');if(idx%2===0){const slot=idx/2;if(!solution&&slot===t.missing){const blank=document.createElement('span');blank.className='solution-box';cell.append(blank)}else{cell.textContent=String(part);if(solution&&slot===t.missing)cell.classList.add('solution-value')}}else cell.textContent=part;val.append(cell)});el.append(val);grid.append(el)});h.append(grid);if(!solution){const cut=document.createElement('span');cut.className='cut';cut.textContent='✂';h.append(cut)}return h}
function generate(){const ops=$$('input[name=op]:checked').map(x=>x.value),missing=$$('input[name=missing]:checked').map(x=>Number(x.value)),series=$$('input[name=series]:checked').map(x=>Number(x.value));if(!ops.length||!missing.length||(mode()==='mul'&&!series.length)){$('#message').textContent='Bitte mindestens eine Rechenart, eine gesuchte Zahl und gegebenenfalls eine Einmaleinsreihe auswählen.';return}$('#message').textContent='';const limit=Number($('input[name=range]:checked').value),count=Number($('#count').value);window.currentDigits=mode()==='add'?String(limit).length:String(Math.max(...series)*10).length;$('#worksheets').replaceChildren();$('#solutions').replaceChildren();for(let j=0;j<2;j++){const tasks=[],seen=new Set();for(let i=0;i<count;i++){let t,k,tries=0;do{t=task(choice(ops),choice(missing),limit,series);k=t.question;tries++}while(seen.has(k)&&tries<100);seen.add(k);tasks.push(t)}number++;$('#worksheets').append(half(number,tasks,false));$('#solutions').append(half(number,tasks,true))}}
$('#generate').onclick=generate;$('#print').onclick=()=>window.print();update();generate();
</script></body></html>
